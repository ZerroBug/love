<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>I Love Mrs. Trouble ❤️</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        font-family: "Poppins", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, #ff7eb3 0%, transparent 35%),
          radial-gradient(circle at bottom right, #7b2ff7 0%, transparent 40%),
          linear-gradient(135deg, #16001f, #330033, #14001c);

        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }

      /* Background glow */
      .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: rgba(255, 50, 150, 0.15);
        filter: blur(80px);
        animation: glowMove 8s ease-in-out infinite alternate;
      }

      @keyframes glowMove {
        from {
          transform: translate(-150px, -80px);
        }

        to {
          transform: translate(150px, 100px);
        }
      }

      /* Main card */
      .card {
        position: relative;
        z-index: 10;
        width: min(90%, 650px);
        padding: 55px 30px;
        text-align: center;

        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 35px;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
          0 25px 70px rgba(0, 0, 0, 0.45),
          inset 0 0 30px rgba(255, 255, 255, 0.04);

        animation: cardFloat 4s ease-in-out infinite;
      }

      @keyframes cardFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }
      }

      .small-heart {
        font-size: 55px;
        animation: heartbeat 1.3s infinite;
        display: inline-block;
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
        }

        15% {
          transform: scale(1.25);
        }

        30% {
          transform: scale(1);
        }

        45% {
          transform: scale(1.2);
        }
      }

      h1 {
        margin-top: 15px;
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 800;
        line-height: 1.05;

        background: linear-gradient(90deg, #fff, #ff8acb, #ff3d81, #fff);

        background-size: 300%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        animation: textGlow 5s linear infinite;
      }

      @keyframes textGlow {
        0% {
          background-position: 0%;
        }

        100% {
          background-position: 300%;
        }
      }

      .trouble {
        display: block;
        font-size: 0.7em;
        color: #ff73b9;
        text-shadow: 0 0 25px rgba(255, 60, 150, 0.7);
      }

      .message {
        margin: 25px auto;
        max-width: 500px;
        font-size: 1.05rem;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.82);
      }

      .message span {
        color: #ff8bc7;
        font-weight: 700;
      }

      /* Button */
      button {
        border: none;
        outline: none;
        cursor: pointer;

        padding: 15px 32px;
        border-radius: 50px;

        color: white;
        font-size: 1rem;
        font-weight: 700;

        background: linear-gradient(135deg, #ff3d81, #b62cff);

        box-shadow: 0 10px 30px rgba(255, 45, 130, 0.35);

        transition: 0.3s ease;
      }

      button:hover {
        transform: translateY(-4px) scale(1.04);

        box-shadow: 0 15px 40px rgba(255, 45, 130, 0.55);
      }

      button:active {
        transform: scale(0.95);
      }

      /* Floating bubbles */
      .bubble {
        position: absolute;
        bottom: -100px;

        border-radius: 50%;

        background: radial-gradient(
          circle at 30% 25%,
          rgba(255, 255, 255, 0.8),
          rgba(255, 130, 200, 0.25) 30%,
          rgba(255, 255, 255, 0.04) 70%
        );

        border: 1px solid rgba(255, 255, 255, 0.25);

        box-shadow:
          inset 0 0 15px rgba(255, 255, 255, 0.15),
          0 0 20px rgba(255, 100, 190, 0.1);

        animation: bubbleUp linear infinite;
      }

      @keyframes bubbleUp {
        0% {
          transform: translateY(0) translateX(0) scale(0.7);

          opacity: 0;
        }

        10% {
          opacity: 0.7;
        }

        50% {
          transform: translateY(-50vh) translateX(40px) scale(1);
        }

        100% {
          transform: translateY(-115vh) translateX(-60px) scale(1.2);

          opacity: 0;
        }
      }

      /* Floating hearts */
      .heart {
        position: absolute;
        bottom: -50px;
        font-size: 25px;
        pointer-events: none;
        animation: heartFloat 5s linear forwards;
        z-index: 5;
      }

      @keyframes heartFloat {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0.5) rotate(0deg);
        }

        15% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translateY(-100vh) translateX(var(--move)) scale(1.5)
            rotate(25deg);
        }
      }

      /* Sparkles */
      .sparkle {
        position: absolute;
        width: 5px;
        height: 5px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 15px white;
        animation: sparkle 2s infinite ease-in-out;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0.1;
          transform: scale(0.5);
        }

        50% {
          opacity: 1;
          transform: scale(1.5);
        }
      }

      .signature {
        margin-top: 25px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.5);
      }

      /* Mobile */
      @media (max-width: 600px) {
        .card {
          padding: 45px 20px;
          border-radius: 25px;
        }

        h1 {
          font-size: 3rem;
        }

        .message {
          font-size: 0.95rem;
        }

        .small-heart {
          font-size: 45px;
        }
      }
    </style>
  </head>

  <body>
    <div class="glow"></div>

    <!-- Sparkles -->
    <div class="sparkle" style="top: 15%; left: 12%"></div>
    <div
      class="sparkle"
      style="top: 25%; left: 85%; animation-delay: 0.7s"
    ></div>
    <div
      class="sparkle"
      style="top: 70%; left: 8%; animation-delay: 1.2s"
    ></div>
    <div
      class="sparkle"
      style="top: 80%; left: 90%; animation-delay: 0.4s"
    ></div>
    <div
      class="sparkle"
      style="top: 10%; left: 50%; animation-delay: 1.5s"
    ></div>

    <!-- Main content -->
    <div class="card">
      <div class="small-heart">❤️</div>

      <h1>
        I Love
        <span class="trouble">Mrs. Trouble</span>
      </h1>

      <p class="message">
        You may be <span>Mrs. Trouble</span>... but somehow, you're also my
        favorite kind of trouble. 😍 <br /><br />
        Life is more beautiful, more exciting, and definitely more interesting
        with you. ❤️
      </p>

      <button onclick="sendLove()">💕 Send More Love</button>

      <div class="signature">Made with ❤️ just for Mrs. Trouble</div>
    </div>

    <script>
      /* --------------------------------
           CREATE BACKGROUND BUBBLES
        -------------------------------- */

      function createBubble() {
        const bubble = document.createElement("div");

        bubble.classList.add("bubble");

        const size = Math.random() * 70 + 20;

        bubble.style.width = size + "px";
        bubble.style.height = size + "px";

        bubble.style.left = Math.random() * 100 + "%";

        bubble.style.animationDuration = Math.random() * 8 + 7 + "s";

        bubble.style.animationDelay = Math.random() * 5 + "s";

        document.body.appendChild(bubble);

        setTimeout(() => {
          bubble.remove();
        }, 16000);
      }

      setInterval(createBubble, 500);

      /* --------------------------------
           CREATE FLOATING HEARTS
        -------------------------------- */

      function createHeart() {
        const heart = document.createElement("div");

        heart.classList.add("heart");

        const hearts = ["❤️", "💕", "💖", "💗", "💓", "💘", "💞"];

        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left = Math.random() * 100 + "%";

        heart.style.fontSize = Math.random() * 25 + 18 + "px";

        heart.style.animationDuration = Math.random() * 3 + 4 + "s";

        heart.style.setProperty("--move", Math.random() * 200 - 100 + "px");

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }

      /* --------------------------------
           BUTTON LOVE EXPLOSION
        -------------------------------- */

      function sendLove() {
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            createHeart();
          }, i * 80);
        }

        const button = document.querySelector("button");

        button.innerHTML = "💖 Love Sent! 💖";

        setTimeout(() => {
          button.innerHTML = "💕 Send More Love";
        }, 2000);
      }

      /* Initial hearts */

      setInterval(createHeart, 900);
    </script>
  </body>
</html>
